server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router): any path that isn't a real static
    # file falls back to index.html so deep links like /matches/<id> work on
    # a hard refresh instead of 404ing at the nginx layer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (js/css with content hashes in their filenames)
    # can be cached aggressively; index.html itself must not be, so a
    # deployed update is always picked up on next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
