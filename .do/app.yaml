# DigitalOcean App Platform spec. Apply with:
#   doctl apps update <APP_ID> --spec .do/app.yaml
# (or paste into App > Settings > App Spec). Auto-deploys on every push to main.
name: dcl
region: blr
services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: /
    github:
      repo: Stadia-India/DCL_score_board
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      failure_threshold: 6
    routes:
      - path: /api
      - path: /health
      - path: /ws
    envs:
      - { key: ENVIRONMENT, value: production }
      - { key: DEBUG, value: "false" }
      - { key: MONGO_URI, scope: RUN_TIME, type: SECRET }
      - { key: MONGO_DB_NAME, value: dcl_scoreboard }
      - { key: JWT_SECRET, scope: RUN_TIME, type: SECRET }
      - { key: ADMIN_BOOTSTRAP_USERNAME, value: admin }
      - { key: ADMIN_BOOTSTRAP_PASSWORD, scope: RUN_TIME, type: SECRET }
      - { key: CORS_ORIGINS, value: "https://dcl-j3clh.ondigitalocean.app" }
      - { key: AUTO_MIGRATE, value: "true" }
      - { key: AUTO_SEED, value: "true" }
      - { key: R2_ACCOUNT_ID, scope: RUN_TIME, type: SECRET }
      - { key: R2_ACCESS_KEY_ID, scope: RUN_TIME, type: SECRET }
      - { key: R2_SECRET_ACCESS_KEY, scope: RUN_TIME, type: SECRET }
      - { key: R2_BUCKET_NAME, value: matchgrid-media }
      - { key: R2_PUBLIC_BASE_URL, scope: RUN_TIME, type: SECRET }
  - name: frontend
    dockerfile_path: frontend/Dockerfile
    source_dir: /
    github:
      repo: Stadia-India/DCL_score_board
      branch: main
      deploy_on_push: true
    http_port: 80
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
jobs:
  # Runs once per deployment, before the new backend instances start serving.
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: backend/Dockerfile
    source_dir: /
    github:
      repo: Stadia-India/DCL_score_board
      branch: main
      deploy_on_push: true
    run_command: python -m app.migrations.runner
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: ENVIRONMENT, value: production }
      - { key: MONGO_URI, scope: RUN_TIME, type: SECRET }
      - { key: MONGO_DB_NAME, value: dcl_scoreboard }
      - { key: JWT_SECRET, scope: RUN_TIME, type: SECRET }
      - { key: ADMIN_BOOTSTRAP_USERNAME, value: admin }
      - { key: ADMIN_BOOTSTRAP_PASSWORD, scope: RUN_TIME, type: SECRET }
