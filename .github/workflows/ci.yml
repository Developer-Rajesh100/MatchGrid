name: MatchGrid Full-Stack CI Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

env:
  # Keep in step with the version that wrote bun.lock and with apps/frontend/Dockerfile.
  BUN_VERSION: '1.4.2'
  PYTHON_VERSION: '3.14'

jobs:
  test:
    name: Full-Stack Regression (Pytest + Vitest + Build + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: dcl_admin
          MONGO_INITDB_ROOT_PASSWORD: change-me-strong-password
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt

      - name: Install backend virtual environment & dependencies
        run: |
          cd apps/backend
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Install workspace dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium with system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Configure test environment variables
        run: |
          {
            echo "MONGO_URI=mongodb://dcl_admin:change-me-strong-password@localhost:27017/?authSource=admin"
            echo "MONGO_DB_NAME=matchgrid"
            echo "ENVIRONMENT=development"
            echo "JWT_SECRET=ci-test-secret-key-for-automated-playwright-runs"
            echo "ADMIN_BOOTSTRAP_USERNAME=admin"
            echo "ADMIN_BOOTSTRAP_PASSWORD=replace-with-a-strong-password"
            echo "AUTO_SEED=false"
            echo "CORS_ORIGINS=http://localhost:5173"
            echo "TOURNAMENT_NAME=MatchGrid"
            echo "TOURNAMENT_SEASON=1"
          } >> apps/backend/.env

      # Secrets are not given to pull requests from forks. Only runs that have them configure R2
      # (and run the R2 media spec); everything else in the suite runs without it.
      - name: Configure Cloudflare R2 (same-repo runs only)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 secrets are not set in this repository: the R2 media spec will be skipped."
            exit 0
          fi
          echo "::add-mask::$R2_SECRET_ACCESS_KEY"
          {
            echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID"
            echo "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo "R2_BUCKET_NAME=$R2_BUCKET_NAME"
            echo "R2_PUBLIC_BASE_URL=$R2_PUBLIC_BASE_URL"
          } >> apps/backend/.env
          echo "E2E_R2=1" >> "$GITHUB_ENV"

      - name: Run Full-Stack Regression Gate (Pytest, Vitest, Build, Playwright)
        run: bun run test:all

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker-images:
    name: Docker images build (API + web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image (root context)
        run: docker build -f apps/backend/Dockerfile -t matchgrid-api:ci .

      - name: Build web image (root context)
        run: docker build -f apps/frontend/Dockerfile -t matchgrid-web:ci .

      - name: API image refuses to boot with development settings in production
        run: |
          if docker run --rm -e ENVIRONMENT=production matchgrid-api:ci > boot.log 2>&1; then
            echo "The production safety checks did not stop an insecure boot"; cat boot.log; exit 1
          fi
          grep -q "Refusing to start with ENVIRONMENT=production" boot.log

      - name: Web image renders a valid nginx config
        run: |
          docker run --rm -e API_UPSTREAM=http://127.0.0.1:8000 matchgrid-web:ci sh -c \
            'envsubst "\${API_UPSTREAM}" < /etc/nginx/templates/default.conf.template > /tmp/default.conf && cp /tmp/default.conf /etc/nginx/conf.d/default.conf && nginx -t'
