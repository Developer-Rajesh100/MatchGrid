name: MatchGrid Full-Stack CI Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full-Stack Regression (Pytest + Vitest + Build + Playwright)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: dcl_admin
          MONGO_INITDB_ROOT_PASSWORD: change-me-strong-password
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend virtual environment & dependencies
        run: |
          cd apps/backend
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Install root and workspace dependencies
        run: bun install

      - name: Install Playwright Chromium with system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Configure test environment variables
        run: |
          echo "MONGO_URI=mongodb://dcl_admin:change-me-strong-password@localhost:27017/?authSource=admin" >> apps/backend/.env
          echo "MONGO_DB_NAME=matchgrid" >> apps/backend/.env
          echo "ENVIRONMENT=development" >> apps/backend/.env
          echo "JWT_SECRET=ci-test-secret-key-for-automated-playwright-runs" >> apps/backend/.env
          echo "ADMIN_BOOTSTRAP_USERNAME=admin" >> apps/backend/.env
          echo "ADMIN_BOOTSTRAP_PASSWORD=replace-with-a-strong-password" >> apps/backend/.env
          echo "AUTO_SEED=false" >> apps/backend/.env
          echo "CORS_ORIGINS=http://localhost:5173" >> apps/backend/.env
          echo "TOURNAMENT_NAME=MatchGrid" >> apps/backend/.env
          echo "TOURNAMENT_SEASON=1" >> apps/backend/.env
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> apps/backend/.env
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> apps/backend/.env
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> apps/backend/.env
          echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> apps/backend/.env
          echo "R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}" >> apps/backend/.env

      - name: Run Full-Stack Regression Gate (Pytest, Vitest, Build, Playwright)
        run: bun run test:all

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
