[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Show every warning from our own code; silence only known third-party noise we cannot fix here
# (Beanie 2.0 / lazy-model read `model_fields` on instances, deprecated since Pydantic 2.11).
filterwarnings =
    default
    ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning:beanie.*
    ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning:lazy_model.*
    # Starlette 1.x nudges TestClient users towards httpx2; the suite stays on httpx (pinned in
    # requirements-dev.txt) until that migration is done deliberately.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
